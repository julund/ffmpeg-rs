# Builds and tests the program with the free group alone and with every
# group, so that neither rots while the other is the one used. A tag v*
# releases the free build alone, with its notices: no build with a codec
# under patent is given out. The tag builds nothing of its own: it releases
# what main's run of the same commit built and tested, so a release is the
# program that passed, and a commit is built once.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    if: github.ref_type != 'tag'
    name: build (${{ matrix.name }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: free
            with: ""
          - name: every group
            with: h264,hevc,vc1,aac-encoder
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          # Cargo, from the step before, on the PATH as Windows has it.
          path-type: inherit
          install: >-
            make diffutils git
            mingw-w64-ucrt-x86_64-toolchain mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-zlib
      # ffmpeg and its libraries, built again only when what goes into them
      # changes; their sources, downloaded once.
      - uses: actions/cache@v6
        with:
          path: |
            target/ffmpeg
            target/sources
          key: ffmpeg-${{ matrix.name }}-${{ hashFiles('build.sh', 'codecs.conf') }}
          restore-keys: ffmpeg-${{ matrix.name }}-
      - run: ./build.sh --with=${{ matrix.with }} --test
      - if: matrix.with == ''
        uses: actions/upload-artifact@v7
        with:
          name: free
          path: |
            target/release/ffmpeg-rs.exe
            target/release/NOTICES.txt
          # What a tag releases, soon after main's push; kept no longer, as
          # it counts against the account's storage.
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # To find main's run of the commit and download what it built.
      actions: read
    steps:
      # main's run of the tagged commit, waited for where it's still going
      # (a tag pushed with main starts its run at the same time), and its
      # free build; a commit main hasn't run, or whose run failed, isn't
      # released.
      - name: Take main's build of the commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 18); do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --branch main --event push --commit "$GITHUB_SHA" --limit 1 \
              --json databaseId --jq '.[0].databaseId')
            [ -n "$run" ] && break
            sleep 10
          done
          if [ -z "$run" ]; then
            echo "::error::$GITHUB_SHA has no run on main: push main, then the tag"
            exit 1
          fi
          if ! gh run watch "$run" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30 > /dev/null; then
            echo "::error::main's run $run of $GITHUB_SHA didn't pass"
            exit 1
          fi
          gh run download "$run" --repo "$GITHUB_REPOSITORY" --name free
      - name: Release the free build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          mv ffmpeg-rs.exe "ffmpeg-rs-$version-x86_64-pc-windows-gnu.exe"
          mv NOTICES.txt "ffmpeg-rs-$version-NOTICES.txt"
          sha256sum ffmpeg-rs-* > "ffmpeg-rs-$version-SHA256SUMS.txt"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "ffmpeg-rs $version" \
            --notes "The free build alone: no codec under patent. Its source is this tag; the sources of what's built into it, and their licences, are in the notices." \
            ffmpeg-rs-*
