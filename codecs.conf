# What the ffmpeg this program links is built with, in groups. Each line is
# a group, a kind of ffmpeg component (decoder, encoder, parser, demuxer,
# muxer, bsf, filter, protocol) and the components' names.
#
# The group "free" is always built: what has no patent left on it, is free
# of royalties, or only drives the system's own codec. Every other group is
# a codec that is still under patent, built only when it's asked for
# (build.sh --with=h264,hevc): left out until it's settled that it may be
# shipped, or its patents have run out.

# Pictures: camcorders' DV and DVDs' MPEG-2, MPEG-4 Part 2 (Xvid, DivX,
# cameras'), Microsoft's MPEG-4 before the standard, Motion JPEG, H.263 and
# Flash's, Windows Media 7 and 8, and what the webview plays already, for a
# frame of it.
free decoder dvvideo mpeg1video mpeg2video mpeg4 msmpeg4v1 msmpeg4v2 msmpeg4v3 mjpeg mjpegb h263 h263p h263i flv wmv1 wmv2 vp8 vp9 theora prores rawvideo png
# Sound: uncompressed, ADPCM, MPEG audio, Dolby Digital and Digital Plus,
# Windows Media Audio, AMR, and the free codecs.
free decoder pcm_s16le pcm_s16be pcm_s24le pcm_s24be pcm_s32le pcm_s32be pcm_u8 pcm_f32le pcm_f32be pcm_alaw pcm_mulaw pcm_dvd pcm_bluray adpcm_ima_wav adpcm_ima_qt adpcm_ms adpcm_yamaha mp1 mp2 mp3 ac3 eac3 wmav1 wmav2 wmapro amrnb amrwb opus vorbis flac alac
# What's made: a frame as PNG, VP9 and Opus by their free libraries, and
# H.264 by Windows' own encoder, which holds no codec of ffmpeg's.
free encoder png libvpx_vp9 libopus h264_mf
free parser h264 hevc mpeg4video mpegvideo mpegaudio ac3 aac opus vorbis vp8 vp9 av1 flac dvd_nav h263 mjpeg
free demuxer mov matroska avi asf mpegts mpegps dv flv h263 mpegvideo ogg wav mp3 aac ac3 eac3 amr
free muxer mp4 mov webm matroska
free bsf aac_adtstoasc extract_extradata h264_mp4toannexb hevc_mp4toannexb vp9_superframe
# (The buffers a graph starts and ends in are always there.)
free filter format aformat scale bwdif aresample null anull setsar transpose hflip vflip
free protocol file pipe

h264 decoder h264
hevc decoder hevc
# Windows Media 9 is VC-1.
vc1 decoder vc1 wmv3 vc1image wmv3image
aac-encoder encoder aac
